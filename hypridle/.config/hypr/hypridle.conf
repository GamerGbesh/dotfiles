general {
  lock_cmd = pidof hyprlock || hyprlock --no-fade-in --immediate-render
  before_sleep_cmd = loginctl lock-session
  # after resume hyprlock loses keyboard focus until a window opens (same as the calculator/wlogout trick),
  # so briefly spawn a throwaway window behind the lock screen
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; sleep 1; kitty --class lock-poke -e sleep 1
  inhibit_sleep = 3   # hold off suspend until hyprlock has actually locked
}

listener {
  timeout = 600                                  
  on-timeout = brightnessctl -s set 10         
  on-resume = brightnessctl -r                 
}

listener {
  timeout = 630
  on-timeout = loginctl lock-session
}

listener {
  timeout = 650
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

